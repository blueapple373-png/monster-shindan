<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MINAMI MINDLAB｜止まりやすい日を、扱える形にする</title>

    <meta
      name="description"
      content="MINAMI MINDLABは、不安、自己否定、自責などで日常が止まりそうなとき、自分を責めずに次の小さな行動を選ぶための仕組みを開発しています。"
    />

    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="MINAMI MINDLAB" />
    <meta
      property="og:description"
      content="感情をなくすのではなく、起きている反応を知り、扱える形にする。"
    />
    <meta
      property="og:url"
      content="https://monster-shindan.vercel.app/"
    />

    <link rel="stylesheet" href="/blog.css" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <style id="home-hero-hotfix">
      .editorial-hero h1 {
        max-width: none;
        font-size: clamp(34px, 3.2vw, 46px);
        line-height: 1.72;
        letter-spacing: 0.03em;
        white-space: nowrap;
      }

      .editorial-hero-inner {
        grid-template-columns: minmax(560px, 0.95fr) minmax(380px, 1.05fr);
        max-width: 1320px;
      }

      .editorial-hero-copy {
        min-width: 0;
      }

      .editorial-hero::before {
        background:
          radial-gradient(ellipse at 78% 60%, rgba(190, 222, 209, 0.18), transparent 42%),
          radial-gradient(ellipse at 86% 70%, rgba(216, 117, 130, 0.12), transparent 38%),
          radial-gradient(ellipse at 72% 78%, rgba(167, 151, 207, 0.11), transparent 40%),
          radial-gradient(ellipse at 70% 54%, rgba(202, 174, 132, 0.08), transparent 44%);
        filter: blur(34px);
        opacity: 0.92;
      }

      .editorial-hero::after {
        background:
          linear-gradient(90deg, rgba(255, 254, 250, 0) 0 46%, rgba(255, 254, 250, 0.52) 74%, rgba(255, 254, 250, 0.1) 100%);
      }

      .hero-geometry-stage::before {
        display: none !important;
      }

      .hero-geometry-stage::after {
        display: none !important;
      }

      .hero-geometry-stage {
        min-height: 520px;
        overflow: visible;
        background: transparent;
      }

      .root-lines {
        display: none !important;
      }

      @media (max-width: 960px) {
        .editorial-hero-inner {
          grid-template-columns: 1fr;
        }

        .editorial-hero h1 {
          font-size: clamp(31px, 8vw, 42px);
          white-space: normal;
        }
      }
    </style>
  </body>
</html>
