<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MINAMI MINDLAB｜止まりやすい日を、扱える形にする</title>

    <meta
      name="description"
      content="MINAMI MINDLABは、不安、自己否定、自責などで日常が止まりそうなとき、自分を責めずに次の小さな行動を選ぶための仕組みを開発しています。"
    />

    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="MINAMI MINDLAB" />
    <meta
      property="og:description"
      content="感情をなくすのではなく、起きている反応を知り、扱える形にする。"
    />
    <meta
      property="og:url"
      content="https://monster-shindan.vercel.app/"
    />

    <link rel="stylesheet" href="/blog.css" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <style id="home-hero-hotfix">
      .site-header {
        position: absolute;
        width: 100%;
        background: transparent;
        box-shadow: none;
        backdrop-filter: none;
      }

      .header-inner {
        max-width: none;
        min-height: 116px;
        padding: 0 46px;
      }

      .brand {
        color: #292521;
        font-family: var(--serif);
        font-size: 25px;
        font-weight: 500;
        letter-spacing: 0.12em;
      }

      .brand small {
        margin-top: 9px;
        color: rgba(157, 134, 111, 0.82);
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.08em;
      }

      .brand-credit {
        display: flex !important;
        align-items: center;
        gap: 8px;
      }

      .brand-credit img {
        width: 22px;
        height: 22px;
        opacity: 0.72;
      }

      .menu-button {
        position: relative;
        width: 48px;
        height: 34px;
        transform: translate(-22px, 3px);
        color: #292521;
        font-size: 0;
        font-weight: 300;
      }

      .menu-button::before,
      .menu-button::after {
        content: "";
        position: absolute;
        right: 6px;
        width: 34px;
        height: 1.4px;
        background: #292521;
      }

      .menu-button::before {
        top: 11px;
      }

      .menu-button::after {
        top: 22px;
      }

      .editorial-hero {
        min-height: 100vh;
        padding: 0 46px;
        background: #fffefa;
      }

      .editorial-hero h1 {
        max-width: none;
        color: rgba(41, 37, 33, 0.96);
        font-size: clamp(44px, 3.45vw, 54px);
        font-weight: 500;
        line-height: 1.72;
        letter-spacing: 0.1em;
        white-space: nowrap;
      }

      .editorial-hero-inner {
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
        width: 100%;
        min-height: 100vh;
        max-width: none;
        margin: 0;
        padding: 42vh 0 0 66px;
      }

      .editorial-hero-copy {
        position: relative;
        z-index: 2;
        min-width: 0;
      }

      .editorial-hero::before {
        inset: 0;
        background:
          radial-gradient(ellipse at 83% 80%, rgba(216, 117, 130, 0.23), transparent 30%),
          radial-gradient(ellipse at 72% 68%, rgba(202, 174, 132, 0.17), transparent 34%),
          radial-gradient(ellipse at 94% 75%, rgba(167, 151, 207, 0.16), transparent 28%),
          radial-gradient(ellipse at 82% 56%, rgba(130, 177, 205, 0.13), transparent 30%),
          radial-gradient(ellipse at 89% 61%, rgba(190, 222, 209, 0.16), transparent 31%);
        filter: blur(52px);
        opacity: 1;
      }

      .editorial-hero::after {
        inset: auto;
        right: -108px;
        bottom: -190px;
        width: min(930px, 62vw);
        aspect-ratio: 1;
        border: 1px solid rgba(190, 160, 126, 0.42);
        border-radius: 50%;
        background:
          radial-gradient(ellipse at 70% 75%, rgba(216, 117, 130, 0.18), transparent 28%),
          radial-gradient(ellipse at 56% 62%, rgba(202, 174, 132, 0.12), transparent 36%),
          radial-gradient(ellipse at 64% 48%, rgba(130, 177, 205, 0.1), transparent 34%),
          radial-gradient(ellipse at 78% 58%, rgba(190, 222, 209, 0.12), transparent 35%),
          rgba(255, 254, 250, 0.22);
        opacity: 0.9;
      }

      .hero-geometry-stage::before {
        display: none !important;
      }

      .hero-geometry-stage::after {
        display: none !important;
      }

      .hero-geometry-stage {
        display: none !important;
      }

      .root-lines {
        display: none !important;
      }

      .hero-copy {
        margin-top: 46px;
        color: rgba(104, 89, 76, 0.66) !important;
        font-size: 17px !important;
        letter-spacing: 0.2em !important;
      }

      .hero-text-link {
        margin-top: 56px;
        color: rgba(61, 49, 41, 0.86);
        font-size: 18px;
        font-weight: 500;
        letter-spacing: 0.18em;
      }

      .hero-text-link::after {
        right: auto;
        width: 154px;
        background: rgba(139, 116, 94, 0.62);
      }

      .hero-rail-link {
        top: 176px;
        right: 92px;
        color: rgba(156, 128, 101, 0.72);
        font-family: var(--serif);
        gap: 8px;
      }

      .hero-rail-link i {
        order: 4;
        width: 1.2px !important;
        height: 245px;
        margin-top: 16px;
        background: rgba(184, 150, 116, 0.58);
        clip-path: polygon(50% 0, 100% 8px, 100% calc(100% - 8px), 50% 100%, 0 calc(100% - 8px), 0 8px);
      }

      .hero-rail-link span {
        color: rgba(91, 65, 44, 0.82);
      }

      .hero-rail-link span::after {
        content: "/";
        display: block;
        margin-top: 10px;
        color: rgba(156, 128, 101, 0.72);
        font-size: 13px;
        line-height: 1;
      }

      .hero-rail-link strong {
        order: 3;
        color: rgba(156, 128, 101, 0.72);
        font-size: 13px;
        font-weight: 400;
        text-transform: lowercase;
      }

      .site-footer {
        color: #fffaf1;
        background: #6f6256;
      }

      .footer-top {
        border-bottom-color: rgba(255, 250, 241, 0.22);
      }

      .footer-brand small {
        color: rgba(255, 250, 241, 0.68);
      }

      .footer-copy,
      .footer-nav a {
        color: rgba(255, 250, 241, 0.78);
      }

      .footer-bottom {
        color: rgba(255, 250, 241, 0.62);
      }

      @media (max-width: 960px) {
        .editorial-hero-inner {
          grid-template-columns: 1fr;
          padding: 90px 0 0;
        }

        .editorial-hero h1 {
          font-size: clamp(31px, 8vw, 42px);
          white-space: normal;
        }
      }
    </style>
  </body>
</html>
