  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <style id="home-hero-hotfix">
      .editorial-hero h1 {
        max-width: 760px;
        font-size: clamp(28px, 2.7vw, 38px);
        line-height: 1.85;
        letter-spacing: 0.06em;
      }

      .editorial-hero::before {
        background:
          radial-gradient(ellipse at 76% 58%, rgba(190, 222, 209, 0.18), transparent 58%),
          radial-gradient(ellipse at 87% 68%, rgba(216, 117, 130, 0.13), transparent 52%),
          radial-gradient(ellipse at 70% 76%, rgba(167, 151, 207, 0.12), transparent 56%);
        filter: blur(26px);
        opacity: 0.95;
      }

      .hero-geometry-stage::before {
        display: none;
      }

      .hero-geometry-stage::after {
        right: -22%;
        bottom: -24%;
        width: min(820px, 76vw);
        border-radius: 45% 55% 42% 58%;
        background:
          radial-gradient(ellipse at 34% 62%, rgba(216, 117, 130, 0.14), transparent 48%),
          radial-gradient(ellipse at 58% 54%, rgba(167, 151, 207, 0.12), transparent 52%),
          radial-gradient(ellipse at 76% 38%, rgba(190, 222, 209, 0.18), transparent 56%),
          radial-gradient(ellipse at 36% 78%, rgba(202, 174, 132, 0.1), transparent 55%);
        filter: blur(34px);
        opacity: 0.88;
      }

      .root-lines {
        display: none;
      }
    </style>
