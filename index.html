<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MINAMI MINDLAB｜止まりやすい日を、扱える形にする</title>

    <meta
      name="description"
      content="MINAMI MINDLABは、不安、自己否定、自責などで日常が止まりそうなとき、自分を責めずに次の小さな行動を選ぶための仕組みを開発しています。"
    />

    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="MINAMI MINDLAB" />
    <meta
      property="og:description"
      content="感情をなくすのではなく、起きている反応を知り、扱える形にする。"
    />
    <meta
      property="og:url"
      content="https://monster-shindan.vercel.app/"
    />

    <link rel="stylesheet" href="/blog.css" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <style id="home-hero-hotfix">
      .editorial-hero {
        background: #fbf9f5;
      }

      .editorial-hero h1 {
        max-width: none;
        font-size: 34px;
        line-height: 1.5;
        letter-spacing: 0.01em;
        white-space: nowrap;
      }

      .editorial-hero-inner {
        display: flex;
        align-items: center;
        min-height: calc(100vh - 152px);
        max-width: 1080px;
      }

      .editorial-hero-copy {
        position: relative;
        z-index: 2;
        min-width: 0;
      }

      .editorial-hero::before {
        background:
          radial-gradient(circle at 82% 88%, rgba(124, 111, 168, 0.18), transparent 28%),
          radial-gradient(circle at 76% 76%, rgba(189, 91, 84, 0.16), transparent 24%),
          radial-gradient(circle at 88% 63%, rgba(79, 143, 108, 0.14), transparent 22%),
          radial-gradient(circle at 0% 8%, rgba(63, 127, 151, 0.12), transparent 19%);
        filter: blur(72px);
        opacity: 1;
      }

      .editorial-hero::after {
        background:
          linear-gradient(90deg, rgba(251, 249, 245, 0.34) 0%, rgba(251, 249, 245, 0.08) 52%, rgba(251, 249, 245, 0) 100%);
      }

      .hero-geometry-stage::before {
        display: none !important;
      }

      .hero-geometry-stage::after {
        display: none !important;
      }

      .hero-geometry-stage {
        display: none !important;
      }

      .root-lines {
        display: none !important;
      }

      @media (max-width: 960px) {
        .editorial-hero-inner {
          grid-template-columns: 1fr;
        }

        .editorial-hero h1 {
          font-size: clamp(31px, 8vw, 42px);
          white-space: normal;
        }
      }
    </style>
  </body>
</html>
